name: Check casks

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  check:
    runs-on: macos-14
    env:
      # brew audit --online asks the GitHub API; without a token the runner's
      # shared address hits the 60-requests-an-hour limit.
      HOMEBREW_GITHUB_API_TOKEN: ${{ github.token }}
      HOMEBREW_NO_AUTO_UPDATE: 1
    steps:
      - uses: actions/checkout@v4
      - name: Set up the tap
        run: |
          mkdir -p "$(brew --repository)/Library/Taps/itsab1989"
          ln -s "$GITHUB_WORKSPACE" "$(brew --repository)/Library/Taps/itsab1989/homebrew-chromiq"
      - name: brew style
        run: brew style --cask itsab1989/chromiq/chromiq itsab1989/chromiq/chromiq@beta
      - name: brew audit
        run: brew audit --cask --strict --online itsab1989/chromiq/chromiq itsab1989/chromiq/chromiq@beta
